# Derrota y reintento: sin RINGOUT el jugador no toca el mando y el ordenador gana (o se acaba el tiempo).
descripcion = "Pasarela: derrota contra Yamcha, pantalla de reintento y vuelta a la tarjeta"
env = ["DBZ3_TEST_PASARELA=auto,desde=1", "DBZ3_PS2_GAMES=D:/DBZ3HD/ps2_games"]
pasos = [
  'log "pasarela: paso 2/26 \(combate ronda 1\)" 60',
  'log "hub: combate nativo: id 14 contra id 13" 15',
  'log "pasarela: paso 2 estado del combate 4" 60',
  'log "pasarela: paso 2 estado del combate 7" 200',
  'esperar 1500', 'tecla S 1500', 'tecla S 1500', 'tecla Space 2000', 'tecla W 1500', 'tecla Space 3000',
  'log "pasarela: fin del combate \(paso 2\): gana el lado 2" 20',
  'log "pasarela: paso 2/26 \(combate ronda 1\): perdido" 10',
  'esperar 1500', 'captura 01_perdido',
  'log "(?s)perdido.*paso 2/26 \(combate ronda 1\): pantalla" 20',
  'esperar 1500', 'captura 02_tarjeta_reintento',
  'log "(?s)perdido.*ronda 1 \(1/1\): id 14 contra id 13" 20',
  'log "(?s)perdido.*paso 2 estado del combate 4" 60',
  'esperar 2000', 'captura 03_combate_otra_vez',
]
