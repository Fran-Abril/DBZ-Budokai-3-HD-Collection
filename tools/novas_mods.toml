# Nova's Mods: lo que publica tools/novas_mods.py en el repo privado (y descarga el launcher).
# Subir "version" vuelve a ofrecer "Actualizar" a quien lo tenga instalado.
# Textos: nombre_<idioma> / descripcion_<idioma> (es, en, it, de, fr; si falta uno, el ingles).

[[mod]]
id = "historia_freezer"
version = "1.0"
tipo = "campana"
nombre_es = "Historia de Freezer"
nombre_en = "Frieza's Story"
nombre_it = "La storia di Freezer"
nombre_de = "Freezers Geschichte"
nombre_fr = "L'histoire de Freezer"
descripcion_es = "La historia recortada de Freezer en Dragon Universe: viaja por el mapa en su nave, de Namek a la Tierra, con sus combates, dialogos y Mecha Freezer."
descripcion_en = "Frieza's cut Dragon Universe story: travel the map in his pod, from Namek to Earth, with its own battles, dialogue and Mecha Frieza."
descripcion_it = "La storia tagliata di Freezer in Dragon Universe: viaggia sulla mappa con la sua navicella, da Namek alla Terra, con battaglie, dialoghi e Mecha Freezer."
descripcion_de = "Freezers gestrichene Dragon-Universe-Geschichte: reise in seiner Kapsel von Namek zur Erde, mit eigenen Kampfen, Dialogen und Mecha-Freezer."
descripcion_fr = "L'histoire coupee de Freezer dans Dragon Universe : parcours la carte dans sa capsule, de Namek a la Terre, avec ses combats, dialogues et Mecha Freezer."

