# Nova's Mods: lo que publica tools/novas_mods.py en el repo privado (y descarga el launcher).
# Subir "version" vuelve a ofrecer "Actualizar" a quien lo tenga instalado.
# Textos: nombre_<idioma> / descripcion_<idioma> (es, en, it, de, fr; si falta uno, el ingles).
# autor / enlaces = ["https://..."]: credito con botones clicables en la ficha del launcher.
# release = "<tag>": zip grande (> 100 MB) partido en assets de esa release (ver tools/novas_mods.py).

[[mod]]
id = "texturas_hd_pv"
version = "2.0"
tipo = "texturas"
release = "texturas-hd-pv-2.0"
autor = "SSGPrinceVegeta"
enlaces = ["https://x.com/SSGPrinceVegeta", "https://linktr.ee/ssgprincevegeta"]
nombre_es = "Pack de texturas HD (PV)"
nombre_en = "HD Texture Pack (PV)"
descripcion_es = "Pack HD de SSGPrinceVegeta: unas 5300 texturas del juego a x4 (algunas a x8). Ocupa unos 2,9 GB; se enciende y apaga con F1 > Pack HD de texturas."
descripcion_en = "HD pack by SSGPrinceVegeta: about 5300 game textures at x4 (a few at x8). About 2.9 GB; turn it on and off with F1 > HD texture pack."
nombre_it = "Pack di texture HD (PV)"
nombre_de = "HD-Texturpaket (PV)"
nombre_fr = "Pack de textures HD (PV)"
descripcion_it = "Pack HD di SSGPrinceVegeta: circa 5300 texture del gioco a x4 (alcune a x8). Occupa circa 2,9 GB; si attiva e disattiva con F1 > Pack HD di texture."
descripcion_de = "HD-Paket von SSGPrinceVegeta: rund 5300 Spieltexturen in x4 (einige in x8). Etwa 2,9 GB; mit F1 > HD-Texturpaket ein- und ausschalten."
descripcion_fr = "Pack HD de SSGPrinceVegeta : environ 5300 textures du jeu en x4 (quelques-unes en x8). Environ 2,9 Go ; s'active et se désactive avec F1 > Pack de textures HD."

